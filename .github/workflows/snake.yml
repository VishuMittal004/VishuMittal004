name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=EF4444&color_dots=#0d1117,#7f1d1d,#991b1b,#b91c1c,#dc2626
            dist/github-snake-dark.svg?palette=github-dark&color_snake=EF4444&color_dots=#0d1117,#7f1d1d,#991b1b,#b91c1c,#dc2626

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
